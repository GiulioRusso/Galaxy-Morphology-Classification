# 115 handcrafted features + 30 morphology measurements (net/data/morphology.py) + histogram gradient boosting.
# Cheap check that the measurements add information beyond handcrafted_morph_hgb.yaml. Needs scripts/segment.py first.
#   train + test: uv run scripts/main.py config/handcrafted_morph_hgb.yaml
#   reproduce:    uv run scripts/main.py experiments/<run>/parameters.yaml
#   test again:   uv run scripts/inference.py experiments/<run>/parameters.yaml

framework: ml
name: null                          # experiment folder suffix; null = this file name
title: "Handcrafted + morphology features + gradient boosting"
output_dir: experiments
seed: 0                             # model and data-order seed
deterministic: false

data:
  images: data/Galaxy10_DECals.npy
  split: splits/galaxy10.csv
  limit: null                         # images per split, for quick debugging
  features_cache: data/features.npz   # input cache shared by all runs (computed once)
  morphology: data/morphology.npz    # from scripts/segment.py; null = handcrafted features only
  workers: null                       # feature-extraction processes (null = all cores)

model:                                # keyword arguments of sklearn HistGradientBoostingClassifier
  learning_rate: 0.05
  max_iter: 1000
  class_weight: balanced
  early_stopping: true                # internal split of the training set

inference:
  checkpoint: null                    # set to this run's model.joblib when training ends
  split: test
  after_train: true
