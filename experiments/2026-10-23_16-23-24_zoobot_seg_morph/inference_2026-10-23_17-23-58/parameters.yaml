# reproduce: uv run scripts/main.py experiments/2026-10-23_16-23-24_zoobot_seg_morph/inference_2026-10-23_17-23-58/parameters.yaml
# command:   uv run scripts/main.py config/zoobot_seg_morph.yaml train.resume=experiments/2026-10-23_13-44-12_zoobot_seg_morph/checkpoints.nosync/last.pt train.resume_optimizer=true
# git:       70c1776 (dirty)
# python:    3.11.15 on macOS-26.6.2-arm64-arm-64bit

framework: dl
name: zoobot_seg_morph
title: Zoobot + segmentation channel + morphology
output_dir: experiments
seed: 0
deterministic: false
device: auto
mps_memory_fraction: 0.4
data:
  images: data/Galaxy10_DECals.npy
  split: splits/galaxy10.csv
  limit: null
  sampler: true
  segmaps: data/segmaps.npy
  morphology: data/morphology.npz
  batch_size: 32
  num_workers: 3
transforms:
  train:
  - name: to_tensor
  - name: d4
  - name: random_crop
    size: 224
  - name: color_jitter
    brightness: 0.1
    contrast: 0.1
  - name: normalize
  eval:
  - name: to_tensor
  - name: center_crop
    size: 224
  - name: normalize
model:
  name: hf_hub:mwalmsley/zoobot-encoder-convnext_tiny
  num_classes: 10
  pretrained: true
  grad_checkpointing: true
  in_chans: 4
  extra_features: 30
loss:
  name: CrossEntropyLoss
optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.05
scheduler:
  name: CosineAnnealingLR
  T_max: 30
train:
  epochs: 30
  monitor: val_macro_f1
  mode: max
  patience: null
  amp: true
  resume: experiments/2026-10-23_13-44-12_zoobot_seg_morph/checkpoints.nosync/last.pt
  resume_optimizer: true
inference:
  checkpoint: experiments/2026-10-23_16-23-24_zoobot_seg_morph/checkpoints.nosync/best.pt
  split: test
  after_train: true
