[project]
name = "galaxy10"
version = "2.0.0"
description = "Leakage-free 10-class Galaxy10 DECaLS benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "timm==1.0.30",
    "scikit-learn==1.7.2",
    "scikit-image==0.25.2",
    "opencv-python-headless==5.0.0.93",
    "h5py==3.16.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "pyyaml==6.0.3",
    "tqdm==4.70.1",
    "joblib==1.6.0",
    "photutils==3.0.0",
    "statmorph==0.7.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "jupyter==1.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["net"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
include = ["net/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
lint.select = ["E", "F", "W", "I", "B", "UP"]
lint.ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
